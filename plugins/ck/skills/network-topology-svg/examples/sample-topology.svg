<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1010" width="1640" height="1010" font-family="Helvetica, Arial, sans-serif">
  <style>
    .band { fill: #f6f7f9; stroke: none; }
    .tier { font-size: 15px; font-weight: bold; fill: #666; letter-spacing: 1px; }
    .box { stroke: #333; stroke-width: 1.5; }
    .fwbox { fill: #fde2e2; }
    .spbox { fill: #dbe8fb; }
    .lfbox { fill: #dff3e4; }
    .acbox { fill: #fff3d6; }
    .vcframe { fill: none; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .name { font-size: 15px; font-weight: bold; fill: #111; text-anchor: middle; }
    .sub { font-size: 11px; fill: #333; text-anchor: middle; }
    .tag { fill: #fff; stroke: #555; stroke-width: 1; }
    .tagt { font-size: 10px; font-family: Menlo, Consolas, monospace; fill: #111; text-anchor: middle; }
    .port { font-size: 10px; font-family: Menlo, Consolas, monospace; fill: #111; }
    .note { font-size: 11px; fill: #333; }
    .s1 { stroke: #1f5fbf; stroke-width: 2; }
    .s2 { stroke: #7b3fb0; stroke-width: 2; }
    .fw { stroke: #c0392b; stroke-width: 2; }
    .ha { stroke: #8e1b10; stroke-width: 2; }
    .peer { stroke: #222; stroke-width: 3; }
    .esi { stroke: #d35400; stroke-width: 2.5; }
    .vc { stroke: #888; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
  </style>

  <rect width="1640" height="1010" fill="#fff"/>
  <text x="20" y="22" font-size="16" font-weight="bold" fill="#111">Sample 4-tier lab topology (see topology.md for cable list)</text>

  <!-- tier bands -->
  <rect class="band" x="10" y="32" width="1620" height="108"/>
  <rect class="band" x="10" y="205" width="1620" height="160"/>
  <rect class="band" x="10" y="485" width="1620" height="150"/>
  <rect class="band" x="10" y="680" width="1620" height="320"/>
  <text class="tier" x="24" y="92">FIREWALL</text>
  <text class="tier" x="24" y="292">SPINE</text>
  <text class="tier" x="24" y="565">LEAF</text>
  <text class="tier" x="24" y="845">ACCESS</text>

  <!-- links: firewall -->
  <line class="fw" x1="550" y1="120" x2="550" y2="230"/>
  <line class="fw" x1="650" y1="120" x2="1090" y2="230"/>
  <line class="fw" x1="1090" y1="120" x2="650" y2="230"/>
  <line class="fw" x1="1190" y1="120" x2="1190" y2="230"/>
  <line class="ha" x1="710" y1="78" x2="1030" y2="78"/>
  <line class="ha" x1="710" y1="92" x2="1030" y2="92"/>

  <!-- links: spine ICL -->
  <line class="peer" x1="770" y1="272" x2="970" y2="272"/>
  <line class="peer" x1="770" y1="302" x2="970" y2="302"/>

  <!-- links: fabric, Spine1 -->
  <line class="s1" x1="486" y1="350" x2="220" y2="500"/>
  <line class="s1" x1="566" y1="350" x2="640" y2="500"/>
  <line class="s1" x1="646" y1="350" x2="1000" y2="500"/>
  <line class="s1" x1="726" y1="350" x2="1420" y2="500"/>
  <!-- links: fabric, Spine2 -->
  <line class="s2" x1="1026" y1="350" x2="320" y2="500"/>
  <line class="s2" x1="1106" y1="350" x2="740" y2="500"/>
  <line class="s2" x1="1186" y1="350" x2="1100" y2="500"/>
  <line class="s2" x1="1266" y1="350" x2="1520" y2="500"/>

  <!-- links: leaf peer links -->
  <line class="peer" x1="400" y1="548" x2="560" y2="548"/>
  <line class="peer" x1="400" y1="576" x2="560" y2="576"/>
  <line class="peer" x1="1180" y1="548" x2="1340" y2="548"/>
  <line class="peer" x1="1180" y1="576" x2="1340" y2="576"/>

  <!-- links: ESI-LAG to access -->
  <line class="esi" x1="270" y1="620" x2="420" y2="705"/>
  <line class="esi" x1="690" y1="620" x2="600" y2="810"/>
  <line class="esi" x1="1050" y1="620" x2="1200" y2="705"/>
  <line class="esi" x1="1470" y1="620" x2="1380" y2="810"/>

  <!-- links: VC -->
  <line class="vc" x1="480" y1="755" x2="480" y2="785"/>
  <line class="vc" x1="480" y1="835" x2="480" y2="865"/>
  <path class="vc" d="M360,730 C 312,730 312,890 360,890"/>
  <line class="vc" x1="1240" y1="755" x2="1240" y2="785"/>
  <line class="vc" x1="1280" y1="755" x2="1280" y2="785"/>

  <!-- firewall nodes -->
  <rect class="box fwbox" x="490" y="50" width="220" height="70" rx="8"/>
  <text class="name" x="600" y="76">FW-A</text>
  <text class="sub" x="600" y="94">SRX2300 - HA node0</text>
  <text class="sub" x="600" y="110">AS 65100</text>
  <rect class="box fwbox" x="1030" y="50" width="220" height="70" rx="8"/>
  <text class="name" x="1140" y="76">FW-B</text>
  <text class="sub" x="1140" y="94">SRX2300 - HA node1</text>
  <text class="sub" x="1140" y="110">AS 65100</text>
  <text class="port" x="544" y="135" text-anchor="end">10G-1</text>
  <text class="port" x="656" y="135">10G-2</text>
  <text class="port" x="1084" y="135" text-anchor="end">10G-1</text>
  <text class="port" x="1196" y="135">10G-2</text>
  <text class="note" x="544" y="185" text-anchor="end">v100, v101</text>
  <text class="note" x="1196" y="185">v100, v102</text>
  <text class="note" x="870" y="71" text-anchor="middle">HA control + fabric (SRX HA ports, TBC)</text>

  <!-- spine nodes -->
  <rect class="box spbox" x="430" y="230" width="340" height="120" rx="8"/>
  <text class="name" x="600" y="278">Spine1</text>
  <text class="sub" x="600" y="296">lab-spine-1</text>
  <text class="sub" x="600" y="313">QFX5120-48YM - AS 65101</text>
  <rect class="tag" x="505" y="232" width="90" height="20" rx="3"/><text class="tagt" x="550" y="246">xe-0/0/44</text>
  <rect class="tag" x="605" y="232" width="90" height="20" rx="3"/><text class="tagt" x="650" y="246">xe-0/0/45</text>
  <rect class="tag" x="448" y="326" width="76" height="20" rx="3"/><text class="tagt" x="486" y="340">et-0/0/48</text>
  <rect class="tag" x="528" y="326" width="76" height="20" rx="3"/><text class="tagt" x="566" y="340">et-0/0/49</text>
  <rect class="tag" x="608" y="326" width="76" height="20" rx="3"/><text class="tagt" x="646" y="340">et-0/0/50</text>
  <rect class="tag" x="688" y="326" width="76" height="20" rx="3"/><text class="tagt" x="726" y="340">et-0/0/51</text>

  <rect class="box spbox" x="970" y="230" width="340" height="120" rx="8"/>
  <text class="name" x="1140" y="278">Spine2</text>
  <text class="sub" x="1140" y="296">lab-spine-2</text>
  <text class="sub" x="1140" y="313">QFX5120-48YM - AS 65101</text>
  <rect class="tag" x="1045" y="232" width="90" height="20" rx="3"/><text class="tagt" x="1090" y="246">xe-0/0/44</text>
  <rect class="tag" x="1145" y="232" width="90" height="20" rx="3"/><text class="tagt" x="1190" y="246">xe-0/0/45</text>
  <rect class="tag" x="988" y="326" width="76" height="20" rx="3"/><text class="tagt" x="1026" y="340">et-0/0/48</text>
  <rect class="tag" x="1068" y="326" width="76" height="20" rx="3"/><text class="tagt" x="1106" y="340">et-0/0/49</text>
  <rect class="tag" x="1148" y="326" width="76" height="20" rx="3"/><text class="tagt" x="1186" y="340">et-0/0/50</text>
  <rect class="tag" x="1228" y="326" width="76" height="20" rx="3"/><text class="tagt" x="1266" y="340">et-0/0/51</text>

  <text class="port" x="776" y="267">et-0/0/54</text>
  <text class="port" x="964" y="267" text-anchor="end">et-0/0/54</text>
  <text class="port" x="776" y="297">et-0/0/55</text>
  <text class="port" x="964" y="297" text-anchor="end">et-0/0/55</text>
  <text class="note" x="870" y="325" text-anchor="middle">ae54 ICL - 2x 100G</text>

  <!-- leaf nodes -->
  <rect class="box lfbox" x="140" y="500" width="260" height="120" rx="8"/>
  <text class="name" x="270" y="546">Leaf1</text>
  <text class="sub" x="270" y="563">lab-leaf-1</text>
  <text class="sub" x="270" y="579">EX4650-48Y - AS 65110</text>
  <rect class="tag" x="182" y="502" width="76" height="20" rx="3"/><text class="tagt" x="220" y="516">et-0/0/48</text>
  <rect class="tag" x="282" y="502" width="76" height="20" rx="3"/><text class="tagt" x="320" y="516">et-0/0/49</text>
  <rect class="tag" x="215" y="594" width="110" height="20" rx="3"/><text class="tagt" x="270" y="608">et-0/0/0 ae0</text>

  <rect class="box lfbox" x="560" y="500" width="260" height="120" rx="8"/>
  <text class="name" x="690" y="546">Leaf2</text>
  <text class="sub" x="690" y="563">lab-leaf-2</text>
  <text class="sub" x="690" y="579">EX4650-48Y - AS 65111</text>
  <rect class="tag" x="602" y="502" width="76" height="20" rx="3"/><text class="tagt" x="640" y="516">et-0/0/48</text>
  <rect class="tag" x="702" y="502" width="76" height="20" rx="3"/><text class="tagt" x="740" y="516">et-0/0/49</text>
  <rect class="tag" x="635" y="594" width="110" height="20" rx="3"/><text class="tagt" x="690" y="608">et-0/0/0 ae0</text>

  <rect class="box lfbox" x="920" y="500" width="260" height="120" rx="8"/>
  <text class="name" x="1050" y="546">Leaf3</text>
  <text class="sub" x="1050" y="563">lab-leaf-3</text>
  <text class="sub" x="1050" y="579">EX4650-48Y - AS 65120</text>
  <rect class="tag" x="962" y="502" width="76" height="20" rx="3"/><text class="tagt" x="1000" y="516">et-0/0/48</text>
  <rect class="tag" x="1062" y="502" width="76" height="20" rx="3"/><text class="tagt" x="1100" y="516">et-0/0/49</text>
  <rect class="tag" x="995" y="594" width="110" height="20" rx="3"/><text class="tagt" x="1050" y="608">et-0/0/0 ae0</text>

  <rect class="box lfbox" x="1340" y="500" width="260" height="120" rx="8"/>
  <text class="name" x="1470" y="546">Leaf4</text>
  <text class="sub" x="1470" y="563">lab-leaf-4</text>
  <text class="sub" x="1470" y="579">EX4650-48Y - AS 65121</text>
  <rect class="tag" x="1382" y="502" width="76" height="20" rx="3"/><text class="tagt" x="1420" y="516">et-0/0/48</text>
  <rect class="tag" x="1482" y="502" width="76" height="20" rx="3"/><text class="tagt" x="1520" y="516">et-0/0/49</text>
  <rect class="tag" x="1415" y="594" width="110" height="20" rx="3"/><text class="tagt" x="1470" y="608">et-0/0/0 ae0</text>

  <text class="port" x="406" y="543">et-0/0/54</text>
  <text class="port" x="554" y="543" text-anchor="end">et-0/0/54</text>
  <text class="port" x="406" y="571">et-0/0/55</text>
  <text class="port" x="554" y="571" text-anchor="end">et-0/0/55</text>
  <text class="note" x="480" y="596" text-anchor="middle">ae54 - 2x 100G</text>
  <text class="port" x="1186" y="543">et-0/0/54</text>
  <text class="port" x="1334" y="543" text-anchor="end">et-0/0/54</text>
  <text class="port" x="1186" y="571">et-0/0/55</text>
  <text class="port" x="1334" y="571" text-anchor="end">et-0/0/55</text>
  <text class="note" x="1260" y="596" text-anchor="middle">ae54 - 2x 100G</text>

  <!-- access: Access1 VC (EX4100 x3) under Leaf1/Leaf2 -->
  <rect class="vcframe" x="340" y="690" width="320" height="245" rx="10"/>
  <rect class="box acbox" x="360" y="705" width="240" height="50" rx="6"/>
  <text class="sub" x="480" y="735" font-size="12"><tspan font-weight="bold">Access1-0</tspan> - member 0 - RE - EX4100</text>
  <rect class="box acbox" x="360" y="785" width="240" height="50" rx="6"/>
  <text class="sub" x="480" y="815" font-size="12"><tspan font-weight="bold">Access1-1</tspan> - member 1 - RE - EX4100</text>
  <rect class="box acbox" x="360" y="865" width="240" height="50" rx="6"/>
  <text class="sub" x="480" y="895" font-size="12"><tspan font-weight="bold">Access1-2</tspan> - member 2 - LC - EX4100</text>
  <text class="port" x="428" y="700">et-0/2/0</text>
  <text class="port" x="606" y="828">et-1/2/0</text>
  <text class="name" x="500" y="958" font-size="13">Access1 VC - EX4100 x3 - ae48</text>
  <text class="sub" x="500" y="976">ESI-LAG to Leaf1/Leaf2, ESI ...:00:01, 25G</text>

  <!-- access: Access2 VC (EX4400 x2) under Leaf3/Leaf4 -->
  <rect class="vcframe" x="1120" y="690" width="320" height="165" rx="10"/>
  <rect class="box acbox" x="1140" y="705" width="240" height="50" rx="6"/>
  <text class="sub" x="1260" y="735" font-size="12"><tspan font-weight="bold">Access2-0</tspan> - member 0 - RE - EX4400</text>
  <rect class="box acbox" x="1140" y="785" width="240" height="50" rx="6"/>
  <text class="sub" x="1260" y="815" font-size="12"><tspan font-weight="bold">Access2-1</tspan> - member 1 - RE - EX4400</text>
  <text class="port" x="1206" y="700">et-0/2/0</text>
  <text class="port" x="1386" y="828">et-1/2/0</text>
  <text class="name" x="1280" y="878" font-size="13">Access2 VC - EX4400 x2 - ae48</text>
  <text class="sub" x="1280" y="896">ESI-LAG to Leaf3/Leaf4, ESI ...:00:02, 25G</text>

  <!-- legend -->
  <rect x="700" y="725" width="390" height="265" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="716" y="747" font-size="13" font-weight="bold" fill="#111">Legend</text>
  <line class="s1" x1="716" y1="766" x2="756" y2="766"/><text class="note" x="766" y="770">Spine1 fabric uplink - 100G QSFP28</text>
  <line class="s2" x1="716" y1="790" x2="756" y2="790"/><text class="note" x="766" y="794">Spine2 fabric uplink - 100G QSFP28</text>
  <line class="peer" x1="716" y1="814" x2="756" y2="814"/><text class="note" x="766" y="818">ae54 peer link (ICL) - 2x 100G QSFP28</text>
  <line class="esi" x1="716" y1="838" x2="756" y2="838"/><text class="note" x="766" y="842">ESI-LAG leaf to access - 25G SFP28</text>
  <line class="fw" x1="716" y1="862" x2="756" y2="862"/><text class="note" x="766" y="866">Firewall to spine - 10G SFP+</text>
  <line class="ha" x1="716" y1="883" x2="756" y2="883"/><line class="ha" x1="716" y1="889" x2="756" y2="889"/><text class="note" x="766" y="890">SRX HA control + fabric</text>
  <line class="vc" x1="716" y1="910" x2="756" y2="910"/><text class="note" x="766" y="914">Virtual Chassis port</text>
  <text class="note" x="716" y="940">FW to Spine1: v100 + v101. FW to Spine2: v100 + v102.</text>
  <text class="note" x="716" y="958">Spine ports 44-47 set to 10G (port-range 44 47).</text>
  <text class="note" x="716" y="976">TBC: SRX port names, VC port names.</text>
</svg>
