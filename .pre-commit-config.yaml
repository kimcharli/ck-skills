repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      # Template pyproject.toml has __PLACEHOLDER__ values ruff can't parse.
      - id: ruff-check
        args: [--fix]
        exclude: &templates ^plugins/python-repo-init/skills/python-repo-init/templates/
      - id: ruff-format
        exclude: *templates

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.21
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==0.3.7
          - mdformat-frontmatter==2.0.8
          - mdformat-shfmt==0.2.0
          - mdformat-tables==1.0.0
        args: [--compact-tables]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: local
    hooks:
      - id: check-frontmatter
        name: SKILL.md / command frontmatter guard
        entry: python3 scripts/check_frontmatter.py
        language: system
        pass_filenames: false
        always_run: true
      - id: bats
        name: bats tests/ (pre-push)
        entry: bats tests/
        language: system
        pass_filenames: false
        stages: [pre-push]
